name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout (with llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false


      - name: Install host glslc (Vulkan shader compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc
          # Also expose the NDK-bundled glslc as a fallback for CMake's
          # find_program(Vulkan_GLSLC_EXECUTABLE).
          echo "${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk/26.1.10909125}/shader-tools/linux-x86_64" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('app/src/main/cpp/**', 'third_party/llama.cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cxx-

      - name: Show toolchain versions
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_HOME/ndk" || true
          ls "$ANDROID_HOME/cmake" || true
          ls third_party/llama.cpp | head -20
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "--- glslc (Vulkan shader compiler) ---"
          which glslc || true
          glslc --version | head -3 || true
          echo "--- vendored Vulkan dev-kit ---"
          ls app/src/main/cpp/vulkan
          ls app/src/main/cpp/vulkan/vulkan | head -6
          ls app/src/main/cpp/vulkan/spirv/unified1 | head -4

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon assembleRelease > gradle-build.log 2>&1
          RC=$?
          echo "gradlew exit code: $RC"
          tail -n 120 gradle-build.log || true
          exit $RC

      - name: Publish build log (diagnostics)
        if: failure()
        continue-on-error: true
        run: |
          git config user.email "ci@hermes.local"
          git config user.name "Hermes CI"
          mkdir -p ci-logs
          cp gradle-build.log ci-logs/last-build.log 2>/dev/null || echo "(no gradle-build.log)" > ci-logs/last-build.log
          git checkout -B ci-diagnostics
          git add -f ci-logs/last-build.log
          git commit -m "CI diagnostics for run ${{ github.run_number }}" || true
          git push -f origin ci-diagnostics

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-llama-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
